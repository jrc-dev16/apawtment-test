name: apawtmentweb_admin
description: APawtMent WebAdmin Dashboard

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔹 Core
  crypto: ^3.0.3
  uuid: ^4.5.1
  async: ^2.11.0

  # 🔹 Backend
  supabase_flutter: ^2.9.0

  # 🔹 Storage / Local
  shared_preferences: ^2.2.2

  # 🔹 UI / Charts
  fl_chart: ^0.63.0
  google_fonts: ^4.0.4
  loading_animation_widget: ^1.3.0
  flutter_svg: ^2.0.0

  # 🔹 Date
  intl: ^0.20.2

  # 🔹 Media
  image_picker: ^1.2.0
  image: ^4.5.0
  video_player: ^2.5.0
  image_downloader: ^0.31.0
  gallery_saver: ^2.3.2
  file_picker: ^6.1.1

  # 🔹 Maps
  google_maps_flutter: ^2.13.1
  google_maps_webservice: ^0.0.20-nullsafety.5
  google_places_flutter: ^2.0.6
  google_api_headers: ^4.4.3
  flutter_map: ^4.0.0
  latlong2: ^0.8.0
  geocoding: ^4.0.0

  # 🔹 Web / HTML
  universal_html: ^2.2.4

  # 🔹 Network
  http: ^0.13.6
  http_parser: ^4.1.2

  # 🔹 Utilities
  mailer: ^6.5.0
  flutter_dotenv: ^6.0.0
  url_launcher: ^6.3.2
  connectivity_plus: ^4.0.2

  # 🔹 Navigation
  go_router: ^17.0.0

  # 🔹 QR
  qr_flutter: ^4.1.0

  # 🔹 Background tasks
  flutter_foreground_task: ^9.1.0

  # 🔹 WebView
  webview_flutter: ^4.2.1
  flutter_inappwebview: ^6.0.0

  # 🔹 Appwrite (optional)
  appwrite: ^20.3.1

  # ✅ 🔥 PRINT FEATURE (IMPORTANT)
  pdf: ^3.10.7
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/env

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
    - family: OdorMeanChey
      fonts:
        - asset: assets/fonts/OdorMeanChey-Regular.ttf